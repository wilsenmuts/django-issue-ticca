[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-issue-ticca"
dynamic = ["version"]
description = "Track issues/incidents and health-check a Django system."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wilson Mutebi" },
]
keywords = [
    "django",
    "health-check",
    "monitoring",
    "incidents",
    "observability",
    "error-tracking",
    "slow-response",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
redis = ["redis>=4.5"]
celery = ["celery>=5.3"]
rabbitmq = ["kombu>=5.3"]
all = [
    "djangorestframework>=3.14",
    "redis>=4.5",
    "celery>=5.3",
    "kombu>=5.3",
]
dev = [
    "build>=1.2",
    # DRF is optional at runtime, but the test project registers it when present,
    # so install it here to exercise the DRF integration in CI.
    "djangorestframework>=3.14",
    "twine>=5.1",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[project.urls]
Homepage = "https://github.com/wilsenmuts/django-issue-ticca"
Repository = "https://github.com/wilsenmuts/django-issue-ticca"
Issues = "https://github.com/wilsenmuts/django-issue-ticca/issues"
Changelog = "https://github.com/wilsenmuts/django-issue-ticca/releases"

[tool.setuptools]
include-package-data = true

# The package lives at src/django_issue_ticca (src layout).
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "django_issue_ticca.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django generates migration files (and rewrites them on makemigrations); their
# long lines and import order aren't ours to police.
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["src/django_issue_ticca"]

name: Publish to PyPI

# Publishes to PyPI when you create a GitHub Release, using PyPI "Trusted
# Publishing" (OIDC) -- no API token/secret required.
#
# One-time setup on PyPI:
#   Your project -> Publishing -> Add a new pending publisher
#     Owner:            wilsenmuts
#     Repository:       django-issue-ticca
#     Workflow name:    publish.yml
#     Environment name: pypi
#
# Then bump the version in src/django_issue_ticca/__init__.py, tag, and publish
# a GitHub Release. This workflow builds and uploads the sdist + wheel.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-issue-ticca
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
